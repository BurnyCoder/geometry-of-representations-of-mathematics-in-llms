# MVP run (pre-registered in docs/prereg.md): one model + its random-init copy.
name: mvp
models:
  - key: qwen3.5-2b
    id: Qwen/Qwen3.5-2B-Base
    random_control: true
    sae: {repo: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_50, k: 50}  # Qwen-Scope TopK SAE (exploratory)
conditions: [field_neutral, family]
judges:  # H-A4 abstraction raters from families we do not probe (newest ungated ~3-4B instruct models)
  - ibm-granite/granite-4.0-micro
  - HuggingFaceTB/SmolLM3-3B
  - microsoft/Phi-4-mini-instruct
analysis_split: confirmatory  # "pilot" is only used for debugging before the prereg tag
