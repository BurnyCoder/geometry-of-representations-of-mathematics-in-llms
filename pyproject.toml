[project]
name = "mathgeom"
version = "0.1.0"
description = "Geometry of representations of mathematical concepts (fields, chains, axiom lattices) in LLM activations"
readme = "README.md"
authors = [
    { name = "Libor Burian (BurnyCoder)" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# CUDA build of PyTorch for the RTX 5070 (Blackwell, sm_120) — pattern from
# https://docs.astral.sh/uv/guides/integration/pytorch/#using-a-pytorch-index
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that download or run real models"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
